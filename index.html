<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Learning Journal</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="flex">
            <i class="fa-solid fa-code icon"></i>
            <h1>My learning journal</h1>
            <nav class="nav-bar">
                <button class="menu-btn">
                    <i class="fa-solid fa-bars icon"></i>
                </button>
            </nav>
            <div class="menu-container flex hidden" id="menu-container">
                <ul>
                    <li>
                        <button class="btn" id="home-btn">Home</button>
                    </li>
                    <li>
                        <button class="btn" id="about-btn">About</button>
                    </li>
                </ul>
            </div>
        </header>

        <main id="main-container">
            <div id="hero-section"></div>
            <div class="blog-container"></div>
        </main>

        <footer>
            <h2>My Learning Journal</h2>
            <span>Copyright ©2022</span>
        </footer>

        <script
            src="https://kit.fontawesome.com/152f769850.js"
            crossorigin="anonymous"
        ></script>
        <script src="index.js" type="module"></script>

</html>
